apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodeapp
  namespace: apps
  labels:
    app: nodeapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nodeapp
  template:
    metadata:
      labels:
        app: nodeapp
    spec:
      containers:
        - name: nodeapp
          image: folakemi01/nodeapp-prometheus:v1
          ports:
            - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: nodeapp-service
  namespace: apps
  labels:
    app: nodeapp
spec:
  selector:
    app: nodeapp
  ports:
    - name: http
      port: 3001
      targetPort: 3001